<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>持ち物設定</title>

  <link
    rel="stylesheet"
    href="css/common.css">

</head>


<body>

  <main class="container">

    <header class="page-header">

      <div>

        <h1>持ち物</h1>

        <p class="today"></p>

      </div>

    </header>


    <!-- 今日の持ち物 -->

    <section class="card">

      <h2>今日の持ち物</h2>

      <div id="todayBelongings"></div>

    </section>


    <!-- 教科ごとの設定 -->

    <section class="card">

      <h2>教科ごとの持ち物</h2>

      <p>
        教科ごとの通常の持ち物を登録すると、
        今日の時間割から自動的に持ち物を作成できます。
      </p>

      <div id="subjectBelongingsContainer"></div>

    </section>


    <!-- 毎日の持ち物 -->

    <section class="card">

      <h2>毎日持っていくもの</h2>

      <p>
        時間割に関係なく毎日持っていくものを登録します。
      </p>

      <div id="dailyBelongingsContainer"></div>

      <button
        id="addDailyItemButton"
        class="button">

        ＋ 持ち物を追加

      </button>

    </section>


    <!-- 保存 -->

    <section class="card">

      <button
        id="saveBelongingsButton"
        class="button">

        持ち物設定を保存

      </button>

      <p
        id="saveMessage"
        class="save-message">
      </p>

    </section>

  </main>


  <!-- ナビ -->

    </a>

      <span class="icon">⚙️</span>
      <span>設定</span>
    </a>

  </div>

</nav>

</body>
