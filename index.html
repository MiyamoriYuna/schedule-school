    <!-- =========================
         JavaScript
    ========================= -->

    <script>


        /* =========================
           今日の日付
        ========================= */

        function showToday() {

            const today = new Date();

            const days = [
                "日",
                "月",
                "火",
                "水",
                "木",
                "金",
                "土"
            ];

            const text =
                today.getFullYear() +
                "年" +
                (today.getMonth() + 1) +
                "月" +
                today.getDate() +
                "日（" +
                days[today.getDay()] +
                "）";


            document
                .getElementById("today")
                .textContent = text;

        }


        showToday();



        /* =========================
           ページ切り替え
        ========================= */

        function showPage(pageId, button) {


            console.log(
                "ページ切り替え:",
                pageId
            );


            /* 全ページを非表示 */

            const pages =
                document.querySelectorAll(
                    ".page"
                );


            pages.forEach(function(page) {

                page.classList.remove(
                    "active"
                );

            });



            /* 選択したページを表示 */

            document
                .getElementById(pageId)
                .classList.add("active");



            /* 全ボタンの選択状態を解除 */

            const buttons =
                document.querySelectorAll(
                    ".nav-button"
                );


            buttons.forEach(function(btn) {

                btn.classList.remove(
                    "active"
                );

            });



            /* 押したボタンを選択状態にする */

            button.classList.add(
                "active"
            );

        }



        /* =========================
           IndexedDB
        ========================= */


        const DB_NAME =
            "ScheduleApp";


        const DB_VERSION =
            1;


        const STORE_NAME =
            "settings";


        let db = null;



        /* =========================
           データベースを開く
        ========================= */

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );



        /* =========================
           初回データベース作成
        ========================= */

        request.onupgradeneeded =
            function(event) {


                db =
                    event.target.result;



                if (
                    !db.objectStoreNames.contains(
                        STORE_NAME
                    )
                ) {


                    db.createObjectStore(
                        STORE_NAME,
                        {
                            keyPath: "id"
                        }
                    );


                }

            };



/* =========================
   IndexedDB接続成功
========================= */

request.onsuccess =
function(event) {

    db =
        event.target.result;

    console.log(
        "IndexedDB接続成功"
    );

    loadSettings();

    loadTimetable();

    loadBelongings();

    showTodayTimetable();

    showTodayBelongings();

};

        /* =========================
           IndexedDBエラー
        ========================= */

        request.onerror =
            function(event) {


                console.error(
                    "IndexedDBエラー:",
                    event.target.error
                );

            };



        /* =========================
           保存ボタン
        ========================= */

        document
            .getElementById(
                "saveSettings"
            )
            .addEventListener(
                "click",
                saveSettings
            );



        /* =========================
           設定を保存
        ========================= */

        function saveSettings() {


            /* DBがまだ準備できていない場合 */

            if (!db) {

                alert(
                    "データベースを準備しています。少し待ってからもう一度押してください。"
                );

                return;

            }



            /* 入力された値を取得 */

            const name =
                document
                    .getElementById(
                        "userName"
                    )
                    .value;


            const grade =
                document
                    .getElementById(
                        "userGrade"
                    )
                    .value;



            /* 保存するデータ */

            const data = {

                id: "user",

                name: name,

                grade: grade

            };



            /* 保存処理開始 */

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );



            /* 保存 */

            store.put(data);



            /* 保存成功 */

            transaction.oncomplete =
                function() {


                    document
                        .getElementById(
                            "saveMessage"
                        )
                        .textContent =
                        "✓ 保存しました";


                };



            /* 保存失敗 */

            transaction.onerror =
                function() {


                    alert(
                        "保存に失敗しました。"
                    );


                };

        }



        /* =========================
           設定を読み込む
        ========================= */

        function loadSettings() {


            if (!db) {

                return;

            }



            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );



            const request =
                store.get("user");



            request.onsuccess =
                function() {


                    const data =
                        request.result;



                    /* データがなければ終了 */

                    if (!data) {

                        return;

                    }



                    /* 名前を表示 */

                    document
                        .getElementById(
                            "userName"
                        )
                        .value =
                        data.name || "";



                    /* 学年を表示 */

                    document
                        .getElementById(
                            "userGrade"
                        )
                        .value =
                        data.grade || "";

                };

        }

        /* =========================
   時間割
========================= */

const subjects = [
    "国語",
    "数学",
    "英語",
    "理科",
    "社会",
    "体育",
    "音楽",
    "美術",
    "技術・家庭",
    "その他"
];

const weekdays = [
    "月曜日",
    "火曜日",
    "水曜日",
    "木曜日",
    "金曜日"
];

const periods = 6;


/* =========================
   時間割入力欄を作成
========================= */

function createTimetableSettings() {

    const container =
        document.getElementById(
            "timetableSettings"
        );

    container.innerHTML = "";


    weekdays.forEach(function(day, dayIndex) {

        const dayTitle =
            document.createElement("h4");

        dayTitle.textContent = day;

        container.appendChild(dayTitle);


        for (
            let period = 1;
            period <= periods;
            period++
        ) {

            const label =
                document.createElement("label");

            label.textContent =
                period + "時間目";


            const select =
                document.createElement("select");

            select.id =
                "timetable-" +
                dayIndex +
                "-" +
                period;


            /* 未選択 */

            const emptyOption =
                document.createElement("option");

            emptyOption.value = "";

            emptyOption.textContent =
                "選択してください";

            select.appendChild(
                emptyOption
            );


            /* 教科 */

            subjects.forEach(function(subject) {

                const option =
                    document.createElement("option");

                option.value = subject;

                option.textContent = subject;

                select.appendChild(
                    option
                );

            });


            label.appendChild(select);

            container.appendChild(label);

        }

    });

}



/* =========================
   時間割保存
========================= */

document
    .getElementById("saveTimetable")
    .addEventListener(
        "click",
        saveTimetable
    );


function saveTimetable() {

    if (!db) {

        alert(
            "データベースを準備しています。少し待ってください。"
        );

        return;

    }


    const timetable = {};


    weekdays.forEach(function(day, dayIndex) {

        timetable[day] = [];


        for (
            let period = 1;
            period <= periods;
            period++
        ) {

            const select =
                document.getElementById(
                    "timetable-" +
                    dayIndex +
                    "-" +
                    period
                );


            timetable[day].push(
                select.value
            );

        }

    });


    const transaction =
        db.transaction(
            "settings",
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    store.put({

        id: "timetable",

        timetable: timetable

    });


  transaction.oncomplete =
    function() {

        document
            .getElementById(
                "timetableMessage"
            )
            .textContent =
            "✓ 時間割を保存しました";

        loadTimetable();

        showTodayTimetable();

        showTodayBelongings();

    };

}



/* =========================
   時間割読み込み
========================= */

function loadTimetable() {

    if (!db) {
        return;
    }


    const transaction =
        db.transaction(
            "settings",
            "readonly"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    const request =
        store.get("timetable");


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (!data) {
                return;
            }


            weekdays.forEach(
                function(day, dayIndex) {

                    const dayData =
                        data.timetable[day];


                    if (!dayData) {
                        return;
                    }


                    dayData.forEach(
                        function(subject, index) {

                            const select =
                                document.getElementById(
                                    "timetable-" +
                                    dayIndex +
                                    "-" +
                                    (index + 1)
                                );


                            if (select) {

                                select.value =
                                    subject;

                            }

                        }
                    );

                }
            );

        };

}



/* =========================
   時間割設定を最初に作る
========================= */

createTimetableSettings();

        /* =========================
   今日の時間割を表示
========================= */

function showTodayTimetable() {

    if (!db) {
        return;
    }

    const today = new Date();

    const dayNames = [
        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"
    ];

    const todayName =
        dayNames[today.getDay()];

    const container =
        document.getElementById(
            "todayTimetable"
        );

    /* 土日 */

    if (
        todayName === "土曜日" ||
        todayName === "日曜日"
    ) {

        container.innerHTML =
            "<p>今日は学校がお休みです。</p>";

        return;

    }


    const transaction =
        db.transaction(
            "settings",
            "readonly"
        );

    const store =
        transaction.objectStore(
            "settings"
        );

    const request =
        store.get("timetable");


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                !data ||
                !data.timetable ||
                !data.timetable[todayName]
            ) {

                container.innerHTML =
                    "<p>今日の時間割が登録されていません。</p>";

                return;

            }


            const timetable =
                data.timetable[todayName];


            container.innerHTML = "";


            timetable.forEach(
                function(subject, index) {

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.style.padding =
                        "10px 0";

                    row.style.borderBottom =
                        "1px solid #eee";


                    const period =
                        document.createElement(
                            "strong"
                        );

                    period.textContent =
                        (index + 1) +
                        "時間目　";


                    const subjectText =
                        document.createElement(
                            "span"
                        );

                    subjectText.textContent =
                        subject ||
                        "未登録";


                    row.appendChild(
                        period
                    );

                    row.appendChild(
                        subjectText
                    );


                    container.appendChild(
                        row
                    );

                }
            );

        };

}
        /* =========================
   教科ごとの持ち物
========================= */

function createBelongingsSettings() {

    const container =
        document.getElementById(
            "belongingsSettings"
        );

    container.innerHTML = "";


    subjects.forEach(function(subject) {

        const label =
            document.createElement("label");

        label.textContent =
            subject + "の持ち物";


        const input =
            document.createElement("input");

        input.type = "text";

        input.id =
            "belongings-" + subject;

        input.placeholder =
            "例：教科書、ノート";


        label.appendChild(input);

        container.appendChild(label);

    });

}



/* =========================
   持ち物を保存
========================= */

document
    .getElementById("saveBelongings")
    .addEventListener(
        "click",
        saveBelongings
    );


function saveBelongings() {

    if (!db) {

        alert(
            "データベースを準備しています。少し待ってください。"
        );

        return;

    }


    const belongings = {};


    subjects.forEach(function(subject) {

        const input =
            document.getElementById(
                "belongings-" + subject
            );


        belongings[subject] =
            input.value;

    });


    const transaction =
        db.transaction(
            "settings",
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    store.put({

        id: "belongings",

        belongings: belongings

    });


    transaction.oncomplete =
        function() {

            document
                .getElementById(
                    "belongingsMessage"
                )
                .textContent =

        /* =========================

function showTodayBelongings() {

    if (!db) {
        return;
    }


    const container =
        document.getElementById(
            "todayBelongings"
        );


    if (!container) {
        return;
    }


    const today =
        new Date();


    const dayNames = [
        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"
    ];


    const todayName =
        dayNames[today.getDay()];


    /* 土日は学校の時間割がない */

    if (
        todayName === "土曜日" ||
        todayName === "日曜日"
    ) {

        container.innerHTML =
            "<p>今日は学校がお休みです。</p>";

        return;

    }


    /* 時間割と持ち物を同時に読み込む */

    const transaction =
        db.transaction(
            "settings",
            "readonly"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    const timetableRequest =
        store.get("timetable");


    const belongingsRequest =
        store.get("belongings");


    timetableRequest.onsuccess =
        function() {

            const timetableData =
                timetableRequest.result;


            belongingsRequest.onsuccess =
                function() {

                    const belongingsData =
                        belongingsRequest.result;


                    /* データがない場合 */

                    if (
                        !timetableData ||
                        !timetableData.timetable
                    ) {

                        container.innerHTML =
                            "<p>時間割が登録されていません。</p>";

                        return;

                    }


                    if (
                        !belongingsData ||
                        !belongingsData.belongings
                    ) {

                        container.innerHTML =
                            "<p>教科ごとの持ち物が登録されていません。</p>";

                        return;

                    }


                    const todayTimetable =
                        timetableData
                            .timetable[todayName];


                    if (!todayTimetable) {

                        container.innerHTML =
                            "<p>今日の時間割が登録されていません。</p>";

                        return;

                    }


                    container.innerHTML = "";


                    let hasBelongings =
                        false;


                    /* 時間割を1時間ずつ確認 */

                    todayTimetable.forEach(
                        function(subject, index) {


                            /* 教科が未登録なら無視 */

                            if (!subject) {
                                return;
                            }


                            const items =
                                belongingsData
                                    .belongings[subject];


                            /* 持ち物が登録されていない */

                            if (!items) {
                                return;
                            }


                            /* カンマ・読点で分割 */

                            const itemList =
                                items
                                    .split(/[,、]/)
                                    .map(
                                        function(item) {
                                            return item.trim();
                                        }
                                    )
                                    .filter(
                                        function(item) {
                                            return item !== "";
                                        }
                                    );


                            if (
                                itemList.length === 0
                            ) {
                                return;
                            }


                            hasBelongings =
                                true;


                            /* 教科の見出し */

                            const subjectTitle =
                                document.createElement(
                                    "h4"
                                );


                            subjectTitle.textContent =
                                (index + 1) +
                                "時間目　" +
                                subject;


                            container.appendChild(
                                subjectTitle
                            );


                            /* 持ち物 */

                            itemList.forEach(
                                function(item) {

                                    const label =
                                        document.createElement(
                                            "label"
                                        );


                                    label.style.display =
                                        "flex";

                                    label.style.alignItems =
                                        "center";

                                    label.style.gap =
                                        "10px";

                                    label.style.padding =
                                        "8px 0";


                                    const checkbox =
                                        document.createElement(
                                            "input"
                                        );


                                    checkbox.type =
                                        "checkbox";


                                    checkbox.style.width =
                                        "20px";

                                    checkbox.style.height =
                                        "20px";


                                    const text =
                                        document.createElement(
                                            "span"
                                        );


                                    text.textContent =
                                        item;


                                    label.appendChild(
                                        checkbox
                                    );

                                    label.appendChild(
                                        text
                                    );


                                    container.appendChild(
                                        label
                                    );

                                }
                            );

                        }
                    );


                    if (!hasBelongings) {

                        container.innerHTML =
                            "<p>今日必要な持ち物は登録されていません。</p>";

                    }

                };

        };

}

function addSpecialBelonging(item) {

    if (!db) {

        alert(
            "データベースを準備しています。少し待ってください。"
        );

        return;

    }


    const transaction =
        db.transaction(
            "settings",
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    const request =
        store.get(
            "specialBelongings"
        );


    request.onsuccess =
        function() {

            const data =
                request.result;


            let items = [];


            if (
                data &&
                Array.isArray(data.items)
            ) {

                items =
                    data.items;

/* =========================
   特別な持ち物を削除
========================= */

function deleteSpecialBelonging(index) {

    if (!db) {
        return;
    }


    const transaction =
        db.transaction(
            "settings",
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    const request =
        store.get(
            "specialBelongings"
        );


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                !data ||
                !Array.isArray(data.items)
            ) {

                return;

            }


            data.items.splice(
                index,
                1
            );


            store.put({

                id:
                    "specialBelongings",

                items:
                    data.items

            });


            transaction.oncomplete =
                function() {

                    showSpecialBelongings();

                };

        };

}

let calendarDate = new Date();

let selectedDate = null;


/* =========================
   カレンダー表示
========================= */

function renderCalendar() {

    const calendar =
        document.getElementById("calendar");

    const title =
        document.getElementById("calendarTitle");

    if (!calendar || !title) {
        return;
    }

    /* カレンダーを必ず7列にする */
    calendar.style.display = "grid";
    calendar.style.gridTemplateColumns =
        "repeat(7, minmax(0, 1fr))";
    calendar.style.gap = "5px";
    calendar.style.width = "100%";

    if (!calendar || !title) {
        return;
    }


    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();


    title.textContent =
        year + "年" + (month + 1) + "月";


    calendar.innerHTML = "";


    /* 曜日 */

    const weekNames = [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
    ];


    weekNames.forEach(function(day) {

        const header =
            document.createElement("div");

        header.textContent = day;

        header.style.textAlign =
            "center";

        header.style.fontWeight =
            "bold";

        header.style.padding =
            "5px";


        calendar.appendChild(header);

    });


    /* 月の1日 */

    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    /* 月の日数 */

    const lastDate =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    /* 空白 */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement("div");

        calendar.appendChild(empty);

    }


    /* 日付 */

    for (
        let day = 1;
        day <= lastDate;
        day++
    ) {

        const cell =
            document.createElement("div");

        cell.className =
            "calendar-day";


        const number =
            document.createElement("div");

        number.className =
            "calendar-day-number";

        number.textContent =
            day;


        cell.appendChild(number);


        const dateString =
            year +
            "-" +
            String(month + 1)
                .padStart(2, "0") +
            "-" +
            String(day)
                .padStart(2, "0");


        /* 今日 */

        const today =
            new Date();


        const todayString =
            today.getFullYear() +
            "-" +
            String(
                today.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                today.getDate()
            ).padStart(2, "0");


        if (
            dateString === todayString
        ) {

            cell.classList.add(
                "today"
            );

        }


        /* 選択中 */

        if (
            dateString === selectedDate
        ) {

            cell.classList.add(
                "selected"
            );

        }


        /* 予定表示 */

        loadEventsForDate(
            dateString,
            cell
        );


        /* 日付クリック */

        cell.addEventListener(
            "click",
            function() {

                selectCalendarDate(
                    dateString
                );

            }
        );


        calendar.appendChild(cell);

    }

}

function showEvents(
    dateString
) {

    const list =
        document.getElementById(
            "eventList"
        );


    if (!list || !db) {
        return;
    }


    const transaction =
        db.transaction(
            "settings",
            "readonly"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    const request =
        store.get(
            "calendarEvents"
        );


    request.onsuccess =
        function() {

            const data =
                request.result;


            list.innerHTML = "";


            if (
                !data ||
                !Array.isArray(data.events)
            ) {

                list.innerHTML =
                    "<p>予定はありません。</p>";

                return;

            }


            const events =
                data.events.filter(
                    function(event) {

                        return (
                            event.date ===
                            dateString
                        );

                    }
                );


            if (
                events.length === 0
            ) {

                list.innerHTML =
                    "<p>予定はありません。</p>";

                return;

            }


            events.forEach(
                function(event) {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "event-item";


                    const text =
                        document.createElement(
                            "span"
                        );


                    text.textContent =
                        event.time +
                        "　" +
                        event.type +
                        "　" +
                        event.title;


                    const deleteButton =
                        document.createElement(
                            "button"
                        );


                    deleteButton.textContent =
                        "削除";

                    deleteButton.className =
                        "event-delete";


                    deleteButton.onclick =
                        function() {

                            deleteEvent(
                                event.id
                            );

                        };


                    item.appendChild(
                        text
                    );

                    item.appendChild(
                        deleteButton
                    );


                    list.appendChild(
                        item
                    );

                }
            );

        };

}

function saveCalendarEvent() {

    if (!db) {

        alert(
            "データベースを準備しています。"
        );

        return;

    }


    const date =
        document
            .getElementById(
                "eventDate"
            )
            .value;


    const time =
        document
            .getElementById(
                "eventTime"
            )
            .value;


    const type =
        document
            .getElementById(
                "eventType"
            )
            .value;


    const title =
        document
            .getElementById(
                "eventTitle"
            )
            .value
            .trim();


    if (!date) {

        alert(
            "日付を選択してください。"
        );

        return;

    }


    if (!title) {

        alert(
            "予定を入力してください。"
        );

        return;

    }


    const transaction =
        db.transaction(
            "settings",
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    const request =
        store.get(
            "calendarEvents"
        );


    request.onsuccess =
        function() {

            const data =
                request.result;


            let events = [];


            if (
                data &&
                Array.isArray(data.events)
            ) {

                events =
                    data.events;

            }


            events.push({

                id:
                    Date.now(),

                date:
                    date,

                time:
                    time || "時間未設定",

                type:
                    type,

                title:
                    title

            });


            store.put({

                id:
                    "calendarEvents",

                events:
                    events

            });


            transaction.oncomplete =
                function() {

                    selectedDate =
                        date;


                    document
                        .getElementById(
                            "eventForm"
                        )
                        .style.display =
                        "none";


                    document
                        .getElementById(
                            "eventTitle"
                        )
                        .value =
                        "";


                    document
                        .getElementById(
                            "eventTime"
                        )
                        .value =
                        "";


                    renderCalendar();

                    showEvents(date);

                };

        };

}


/* =========================
   予定を削除
========================= */

function deleteEvent(
    eventId
) {

    const transaction =
        db.transaction(
            "settings",
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    const request =
        store.get(
            "calendarEvents"
        );


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                !data ||
                !Array.isArray(data.events)
            ) {

                return;

            }


            data.events =
                data.events.filter(
                    function(event) {

                        return (
                            event.id !==
                            eventId
                        );

                    }
                );


            store.put({

                id:
                    "calendarEvents",

                events:
                    data.events

            });


            transaction.oncomplete =
                function() {

                    renderCalendar();

                    if (selectedDate) {

                        showEvents(
                            selectedDate
                        );

                    }

                };

        };

}
