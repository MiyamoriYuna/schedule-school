<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <!-- スマートフォンでも画面幅に合わせる -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ホーム | 学校生活管理アプリ</title>

  <!-- 共通CSSを読み込む -->
  <link rel="stylesheet" href="css/common.css">
</head>

<body>

  <!-- メインコンテンツ -->
  <main class="page">

    <!-- ページ上部 -->
    <header class="page-header">
      <h1>ホーム</h1>

      <!-- JavaScriptによって今日の日付が入る -->
      <p class="today"></p>
    </header>



<!-- 今日と明日の時間割 -->
<section class="card">
  <h2>時間割</h2>

  <div class="timetable-comparison">

    <!-- 今日 -->
    <div class="timetable-panel today-panel">
      <h3 id="todayTitle">今日</h3>
      <div id="todayTimetable">
        <p>読み込み中...</p>
      </div>
    </div>

    <!-- 明日 -->
    <div class="timetable-panel tomorrow-panel">
      <h3 id="tomorrowTitle">明日</h3>
      <div id="tomorrowTimetable">
        <p>読み込み中...</p>
      </div>
    </div>

  </div>
</section>


    <!-- 部活動・個人予定 -->
    <section class="card">
      <h2>部活動・個人予定</h2>

      <p>ここに今日の予定を表示します。</p>
    </section>

  </main>


  <!-- 下部ナビゲーション -->
  <nav class="bottom-nav">

    <div class="nav-inner">

      <a class="nav-link" href="calendar.html">
        <span class="icon">🗓️</span>
        <span>月予定</span>
      </a>

      <a class="nav-link" href="todo.html">
        <span class="icon">✅</span>
        <span>やること</span>
      </a>

      <a class="nav-link" href="index.html">
        <span class="icon">🏠</span>
        <span>ホーム</span>
      </a>

      <a class="nav-link" href="belongings.html">
        <span class="icon">🎒</span>
        <span>持ち物</span>
      </a>

      <a class="nav-link" href="settings.html">
        <span class="icon">⚙️</span>
        <span>設定</span>
      </a>

    </div>

  </nav>


  <!-- 共通JavaScriptを読み込む -->
  <script src="js/database.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
  
</body>
</html>
