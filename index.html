<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時間割・予定管理</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            padding-bottom: 80px;
        }

        header {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        #today {
            margin-top: 5px;
            color: #777;
        }

        /* ページ */

        .page {
            display: none;
            padding: 20px;
        }

        .page.active {
            display: block;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
        }

        /* 下部ボタン */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            height: 70px;

            background: white;
            border-top: 1px solid #ddd;

            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-button {
            border: none;
            background: none;

            padding: 8px;

            cursor: pointer;

            color: #777;

            display: flex;
            flex-direction: column;
            align-items: center;

            font-size: 12px;
        }

        .nav-icon {
            font-size: 22px;
        }

        .nav-button.active {
            color: #e85d75;
            font-weight: bold;
        }
    </style>
</head>


<body>


<!-- =========================
     ヘッダー
========================= -->

<header>

    <h1>時間割・予定管理</h1>

    <div id="today"></div>

</header>



<!-- =========================
     月予定
========================= -->

<section
    id="calendar"
    class="page">

    <h2>月予定</h2>

    <div class="card">
        月予定ページです。
    </div>

</section>



<!-- =========================
     やること
========================= -->

<section
    id="todo"
    class="page">

    <h2>やること</h2>

    <div class="card">
        やることリストページです。
    </div>

</section>



<!-- =========================
     ホーム
========================= -->

<section
    id="home"
    class="page active">

    <h2>ホーム</h2>

    <div class="card">
        ホームページです。
    </div>

</section>



<!-- =========================
     持ち物
========================= -->

<section
    id="belongings"
    class="page">

    <h2>持ち物</h2>

    <div class="card">
        持ち物ページです。
    </div>

</section>



<!-- =========================
     設定
========================= -->

<section
    id="settings"
    class="page">

    <h2>設定</h2>

    <div class="card">
        設定ページです。
    </div>

</section>



<!-- =========================
     下部メニュー
========================= -->

<nav class="bottom-nav">


    <button
        class="nav-button"
        onclick="showPage('calendar', this)">

        <span class="nav-icon">🗓️</span>
        <span>月予定</span>

    </button>


    <button
        class="nav-button"
        onclick="showPage('todo', this)">

        <span class="nav-icon">✅</span>
        <span>やること</span>

    </button>


    <button
        class="nav-button active"
        onclick="showPage('home', this)">

        <span class="nav-icon">🏠</span>
        <span>ホーム</span>

    </button>


    <button
        class="nav-button"
        onclick="showPage('belongings', this)">

        <span class="nav-icon">🎒</span>
        <span>持ち物</span>

    </button>


    <button
        class="nav-button"
        onclick="showPage('settings', this)">

        <span class="nav-icon">⚙️</span>
        <span>設定</span>

    </button>


</nav>



<script>

/* =========================
   今日の日付
========================= */

function showToday() {

    const today = new Date();

    const days = [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
    ];

    const text =
        today.getFullYear() +
        "年" +
        (today.getMonth() + 1) +
        "月" +
        today.getDate() +
        "日（" +
        days[today.getDay()] +
        "）";

    document.getElementById("today").textContent = text;
}

showToday();



/* =========================
   ページ切り替え
========================= */

function showPage(pageId, button) {

    console.log("ページ切り替え:", pageId);


    // 全ページを非表示
    const pages =
        document.querySelectorAll(".page");

    pages.forEach(function(page) {

        page.classList.remove("active");

    });


    // 選択したページを表示
    document
        .getElementById(pageId)
        .classList.add("active");


    // 全ボタンのactiveを解除
    const buttons =
        document.querySelectorAll(".nav-button");

    buttons.forEach(function(btn) {

        btn.classList.remove("active");

    });


    // 押したボタンをactiveにする
    button.classList.add("active");

}

</script>


</body>
</html>
