<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>時間割・予定管理</title>


    <style>

        /* =========================
           基本設定
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            padding-bottom: 80px;
        }


        /* =========================
           ヘッダー
        ========================= */

        header {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        #today {
            margin-top: 5px;
            color: #777;
        }


        /* =========================
           ページ
        ========================= */

        .page {
            display: none;
            padding: 20px;
        }

        .page.active {
            display: block;
        }


        /* =========================
           カード
        ========================= */

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
        }


        /* =========================
           設定の入力欄
        ========================= */

        label {
            display: block;
            margin-bottom: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;

            border: 1px solid #ccc;
            border-radius: 10px;

            font-size: 16px;
        }


        /* =========================
           保存ボタン
        ========================= */

        .save-button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #e85d75;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .save-button:active {
            transform: scale(0.98);
        }


        /* =========================
           保存メッセージ
        ========================= */

        #saveMessage {
            margin-top: 12px;
            text-align: center;
            color: #e85d75;
        }


        /* =========================
           下部ボタン
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            height: 70px;

            background: white;
            border-top: 1px solid #ddd;

            display: flex;
            justify-content: space-around;
            align-items: center;

            z-index: 100;
        }


        .nav-button {
            border: none;
            background: none;

            padding: 8px;

            cursor: pointer;

            color: #777;

            display: flex;
            flex-direction: column;
            align-items: center;

            font-size: 12px;
        }


        .nav-icon {
            font-size: 22px;
        }


        .nav-button.active {
            color: #e85d75;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <!-- =========================
         ヘッダー
    ========================= -->

    <header>

        <h1>時間割・予定管理</h1>

        <div id="today"></div>

    </header>



    <!-- =========================
         月予定
    ========================= -->

    <section
        id="calendar"
        class="page">

        <h2>月予定</h2>

        <div class="card">

            月予定ページです。

        </div>

    </section>



    <!-- =========================
         やること
    ========================= -->

    <section
        id="todo"
        class="page">

        <h2>やること</h2>

        <div class="card">

            やることリストページです。

        </div>

    </section>



    <!-- =========================
         ホーム
    ========================= -->

    <section
        id="home"
        class="page active">

        <h2>ホーム</h2>

        <div class="card">

            ホームページです。

        </div>

    </section>



    <!-- =========================
         持ち物
    ========================= -->

    <section
        id="belongings"
        class="page">

        <h2>持ち物</h2>

        <div class="card">

            持ち物ページです。

        </div>

    </section>



    <!-- =========================
         設定
    ========================= -->

    <section
        id="settings"
        class="page">

        <h2>設定</h2>


        <div class="card">

            <h3>基本情報</h3>


            <!-- 名前 -->

            <label>

                名前・ニックネーム

                <input
                    id="userName"
                    type="text"
                    placeholder="例：ゆうな">

            </label>


            <!-- 学年 -->

            <label>

                学年

                <select id="userGrade">

                    <option value="">
                        選択してください
                    </option>

                    <option value="中学1年">
                        中学1年
                    </option>

                    <option value="中学2年">
                        中学2年
                    </option>

                    <option value="中学3年">
                        中学3年
                    </option>

                    <option value="高校1年">
                        高校1年
                    </option>

                    <option value="高校2年">
                        高校2年
                    </option>

                    <option value="高校3年">
                        高校3年
                    </option>

                </select>

            </label>


            <!-- 保存 -->

            <button
                id="saveSettings"
                class="save-button">

                保存

            </button>


            <!-- 保存結果 -->

            <p id="saveMessage"></p>

        </div>

    </section>



    <!-- =========================
         下部ナビゲーション
    ========================= -->

    <nav class="bottom-nav">


        <!-- 月予定 -->

        <button
            class="nav-button"
            onclick="showPage('calendar', this)">

            <span class="nav-icon">
                🗓️
            </span>

            <span>
                月予定
            </span>

        </button>


        <!-- やること -->

        <button
            class="nav-button"
            onclick="showPage('todo', this)">

            <span class="nav-icon">
                ✅
            </span>

            <span>
                やること
            </span>

        </button>


        <!-- ホーム -->

        <button
            class="nav-button active"
            onclick="showPage('home', this)">

            <span class="nav-icon">
                🏠
            </span>

            <span>
                ホーム
            </span>

        </button>


        <!-- 持ち物 -->

        <button
            class="nav-button"
            onclick="showPage('belongings', this)">

            <span class="nav-icon">
                🎒
            </span>

            <span>
                持ち物
            </span>

        </button>


        <!-- 設定 -->

        <button
            class="nav-button"
            onclick="showPage('settings', this)">

            <span class="nav-icon">
                ⚙️
            </span>

            <span>
                設定
            </span>

        </button>


    </nav>



    <!-- =========================
         JavaScript
    ========================= -->

    <script>


        /* =========================
           今日の日付
        ========================= */

        function showToday() {

            const today = new Date();

            const days = [
                "日",
                "月",
                "火",
                "水",
                "木",
                "金",
                "土"
            ];

            const text =
                today.getFullYear() +
                "年" +
                (today.getMonth() + 1) +
                "月" +
                today.getDate() +
                "日（" +
                days[today.getDay()] +
                "）";


            document
                .getElementById("today")
                .textContent = text;

        }


        showToday();



        /* =========================
           ページ切り替え
        ========================= */

        function showPage(pageId, button) {


            console.log(
                "ページ切り替え:",
                pageId
            );


            /* 全ページを非表示 */

            const pages =
                document.querySelectorAll(
                    ".page"
                );


            pages.forEach(function(page) {

                page.classList.remove(
                    "active"
                );

            });



            /* 選択したページを表示 */

            document
                .getElementById(pageId)
                .classList.add("active");



            /* 全ボタンの選択状態を解除 */

            const buttons =
                document.querySelectorAll(
                    ".nav-button"
                );


            buttons.forEach(function(btn) {

                btn.classList.remove(
                    "active"
                );

            });



            /* 押したボタンを選択状態にする */

            button.classList.add(
                "active"
            );

        }



        /* =========================
           IndexedDB
        ========================= */


        const DB_NAME =
            "ScheduleApp";


        const DB_VERSION =
            1;


        const STORE_NAME =
            "settings";


        let db = null;



        /* =========================
           データベースを開く
        ========================= */

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );



        /* =========================
           初回データベース作成
        ========================= */

        request.onupgradeneeded =
            function(event) {


                db =
                    event.target.result;



                if (
                    !db.objectStoreNames.contains(
                        STORE_NAME
                    )
                ) {


                    db.createObjectStore(
                        STORE_NAME,
                        {
                            keyPath: "id"
                        }
                    );


                }

            };



        /* =========================
           IndexedDB接続成功
        ========================= */

        request.onsuccess =
            function(event) {


                db =
                    event.target.result;


                console.log(
                    "IndexedDB接続成功"
                );


                /* 保存データを読み込む */

                loadSettings();

            };



        /* =========================
           IndexedDBエラー
        ========================= */

        request.onerror =
            function(event) {


                console.error(
                    "IndexedDBエラー:",
                    event.target.error
                );

            };



        /* =========================
           保存ボタン
        ========================= */

        document
            .getElementById(
                "saveSettings"
            )
            .addEventListener(
                "click",
                saveSettings
            );



        /* =========================
           設定を保存
        ========================= */

        function saveSettings() {


            /* DBがまだ準備できていない場合 */

            if (!db) {

                alert(
                    "データベースを準備しています。少し待ってからもう一度押してください。"
                );

                return;

            }



            /* 入力された値を取得 */

            const name =
                document
                    .getElementById(
                        "userName"
                    )
                    .value;


            const grade =
                document
                    .getElementById(
                        "userGrade"
                    )
                    .value;



            /* 保存するデータ */

            const data = {

                id: "user",

                name: name,

                grade: grade

            };



            /* 保存処理開始 */

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );



            /* 保存 */

            store.put(data);



            /* 保存成功 */

            transaction.oncomplete =
                function() {


                    document
                        .getElementById(
                            "saveMessage"
                        )
                        .textContent =
                        "✓ 保存しました";


                };



            /* 保存失敗 */

            transaction.onerror =
                function() {


                    alert(
                        "保存に失敗しました。"
                    );


                };

        }



        /* =========================
           設定を読み込む
        ========================= */

        function loadSettings() {


            if (!db) {

                return;

            }



            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );



            const request =
                store.get("user");



            request.onsuccess =
                function() {


                    const data =
                        request.result;



                    /* データがなければ終了 */

                    if (!data) {

                        return;

                    }



                    /* 名前を表示 */

                    document
                        .getElementById(
                            "userName"
                        )
                        .value =
                        data.name || "";



                    /* 学年を表示 */

                    document
                        .getElementById(
                            "userGrade"
                        )
                        .value =
                        data.grade || "";

                };

        }


    </script>


</body>

</html>
