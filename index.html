<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>時間割・予定管理</title>


    <style>

        /* =========================
           基本設定
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8fafc;
            padding-bottom: 80px;
        }


        /* =========================
           ヘッダー
        ========================= */

        header {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        #today {
            margin-top: 5px;
            color: #777;
        }


        /* =========================
           ページ
        ========================= */

        .page {
            display: none;
            padding: 20px;
        }

        .page.active {
            display: block;
        }


        /* =========================
           カード
        ========================= */

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
        }


        /* =========================
           設定の入力欄
        ========================= */

        label {
            display: block;
            margin-bottom: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;

            border: 1px solid #ccc;
            border-radius: 10px;

            font-size: 16px;
        }


        /* =========================
           保存ボタン
        ========================= */

        .save-button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: #e85d75;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .save-button:active {
            transform: scale(0.98);
        }


        /* =========================
           保存メッセージ
        ========================= */

        #saveMessage {
            margin-top: 12px;
            text-align: center;
            color: #e85d75;
        }


        /* =========================
           下部ボタン
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            height: 70px;

            background: white;
            border-top: 1px solid #ddd;

            display: flex;
            justify-content: space-around;
            align-items: center;

            z-index: 100;
        }


        .nav-button {
            border: none;
            background: none;

            padding: 8px;

            cursor: pointer;

            color: #777;

            display: flex;
            flex-direction: column;
            align-items: center;

            font-size: 12px;
        }


        .nav-icon {
            font-size: 22px;
        }


        .nav-button.active {
            color: #e85d75;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <!-- =========================
         ヘッダー
    ========================= -->

    <header>

        <h1>時間割・予定管理</h1>

        <div id="today"></div>

    </header>



    <!-- =========================
         月予定
    ========================= -->

    <section
        id="calendar"
        class="page">

        <h2>月予定</h2>

        <div class="card">

            月予定ページです。

        </div>

    </section>



    <!-- =========================
         やること
    ========================= -->

    <section
        id="todo"
        class="page">

        <h2>やること</h2>

        <div class="card">

            やることリストページです。

        </div>

    </section>



    <!-- =========================
         ホーム
    ========================= -->

    <section
        id="home"
        class="page active">

      <h2>ホーム</h2>

<div class="card">

    <h3>今日の時間割</h3>

    <div id="todayTimetable">
        時間割を読み込んでいます...
    </div>

</div>

    </section>



    <!-- =========================
         持ち物
    ========================= -->

    <section
        id="belongings"
        class="page">

        <h2>持ち物</h2>

        <div class="card">

            持ち物ページです。

        </div>

    </section>



    <!-- =========================
         設定
    ========================= -->

    <section
        id="settings"
        class="page">

        <h2>設定</h2>


        <div class="card">

            <h3>基本情報</h3>


            <!-- 名前 -->

            <label>

                名前・ニックネーム

                <input
                    id="userName"
                    type="text"
                    placeholder="例：ゆうな">

            </label>


            <!-- 学年 -->

            <label>

                学年

                <select id="userGrade">

                    <option value="">
                        選択してください
                    </option>

                    <option value="中学1年">
                        中学1年
                    </option>

                    <option value="中学2年">
                        中学2年
                    </option>

                    <option value="中学3年">
                        中学3年
                    </option>

                    <option value="高校1年">
                        高校1年
                    </option>

                    <option value="高校2年">
                        高校2年
                    </option>

                    <option value="高校3年">
                        高校3年
                    </option>

                </select>

            </label>


            <!-- 保存 -->

            <button
                id="saveSettings"
                class="save-button">

                保存

            </button>


            <!-- 保存結果 -->

            <p id="saveMessage"></p>
            <hr>

<h3>時間割設定</h3>

<div id="timetableSettings"></div>

<button
    id="saveTimetable"
    class="save-button">

    時間割を保存

</button>

<p id="timetableMessage"></p>
            <hr>

<h3>教科ごとの持ち物</h3>

<div id="belongingsSettings"></div>

<button
    id="saveBelongings"
    class="save-button">

    持ち物を保存

</button>

<p id="belongingsMessage"></p>

        </div>

    </section>



    <!-- =========================
         下部ナビゲーション
    ========================= -->

    <nav class="bottom-nav">


        <!-- 月予定 -->

        <button
            class="nav-button"
            onclick="showPage('calendar', this)">

            <span class="nav-icon">
                🗓️
            </span>

            <span>
                月予定
            </span>

        </button>


        <!-- やること -->

        <button
            class="nav-button"
            onclick="showPage('todo', this)">

            <span class="nav-icon">
                ✅
            </span>

            <span>
                やること
            </span>

        </button>


        <!-- ホーム -->

        <button
            class="nav-button active"
            onclick="showPage('home', this)">

            <span class="nav-icon">
                🏠
            </span>

            <span>
                ホーム
            </span>

        </button>


        <!-- 持ち物 -->

        <button
            class="nav-button"
            onclick="showPage('belongings', this)">

            <span class="nav-icon">
                🎒
            </span>

            <span>
                持ち物
            </span>

        </button>


        <!-- 設定 -->

        <button
            class="nav-button"
            onclick="showPage('settings', this)">

            <span class="nav-icon">
                ⚙️
            </span>

            <span>
                設定
            </span>

        </button>


    </nav>



    <!-- =========================
         JavaScript
    ========================= -->

    <script>


        /* =========================
           今日の日付
        ========================= */

        function showToday() {

            const today = new Date();

            const days = [
                "日",
                "月",
                "火",
                "水",
                "木",
                "金",
                "土"
            ];

            const text =
                today.getFullYear() +
                "年" +
                (today.getMonth() + 1) +
                "月" +
                today.getDate() +
                "日（" +
                days[today.getDay()] +
                "）";


            document
                .getElementById("today")
                .textContent = text;

        }


        showToday();



        /* =========================
           ページ切り替え
        ========================= */

        function showPage(pageId, button) {


            console.log(
                "ページ切り替え:",
                pageId
            );


            /* 全ページを非表示 */

            const pages =
                document.querySelectorAll(
                    ".page"
                );


            pages.forEach(function(page) {

                page.classList.remove(
                    "active"
                );

            });



            /* 選択したページを表示 */

            document
                .getElementById(pageId)
                .classList.add("active");



            /* 全ボタンの選択状態を解除 */

            const buttons =
                document.querySelectorAll(
                    ".nav-button"
                );


            buttons.forEach(function(btn) {

                btn.classList.remove(
                    "active"
                );

            });



            /* 押したボタンを選択状態にする */

            button.classList.add(
                "active"
            );

        }



        /* =========================
           IndexedDB
        ========================= */


        const DB_NAME =
            "ScheduleApp";


        const DB_VERSION =
            1;


        const STORE_NAME =
            "settings";


        let db = null;



        /* =========================
           データベースを開く
        ========================= */

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );



        /* =========================
           初回データベース作成
        ========================= */

        request.onupgradeneeded =
            function(event) {


                db =
                    event.target.result;



                if (
                    !db.objectStoreNames.contains(
                        STORE_NAME
                    )
                ) {


                    db.createObjectStore(
                        STORE_NAME,
                        {
                            keyPath: "id"
                        }
                    );


                }

            };



/* =========================
   IndexedDB接続成功
========================= */

request.onsuccess =
function(event) {

    db =
        event.target.result;

    console.log(
        "IndexedDB接続成功"
    );

    loadSettings();

    loadTimetable();

    loadBelongings();

    showTodayTimetable();

};

        /* =========================
           IndexedDBエラー
        ========================= */

        request.onerror =
            function(event) {


                console.error(
                    "IndexedDBエラー:",
                    event.target.error
                );

            };



        /* =========================
           保存ボタン
        ========================= */

        document
            .getElementById(
                "saveSettings"
            )
            .addEventListener(
                "click",
                saveSettings
            );



        /* =========================
           設定を保存
        ========================= */

        function saveSettings() {


            /* DBがまだ準備できていない場合 */

            if (!db) {

                alert(
                    "データベースを準備しています。少し待ってからもう一度押してください。"
                );

                return;

            }



            /* 入力された値を取得 */

            const name =
                document
                    .getElementById(
                        "userName"
                    )
                    .value;


            const grade =
                document
                    .getElementById(
                        "userGrade"
                    )
                    .value;



            /* 保存するデータ */

            const data = {

                id: "user",

                name: name,

                grade: grade

            };



            /* 保存処理開始 */

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );



            /* 保存 */

            store.put(data);



            /* 保存成功 */

            transaction.oncomplete =
                function() {


                    document
                        .getElementById(
                            "saveMessage"
                        )
                        .textContent =
                        "✓ 保存しました";


                };



            /* 保存失敗 */

            transaction.onerror =
                function() {


                    alert(
                        "保存に失敗しました。"
                    );


                };

        }



        /* =========================
           設定を読み込む
        ========================= */

        function loadSettings() {


            if (!db) {

                return;

            }



            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );



            const request =
                store.get("user");



            request.onsuccess =
                function() {


                    const data =
                        request.result;



                    /* データがなければ終了 */

                    if (!data) {

                        return;

                    }



                    /* 名前を表示 */

                    document
                        .getElementById(
                            "userName"
                        )
                        .value =
                        data.name || "";



                    /* 学年を表示 */

                    document
                        .getElementById(
                            "userGrade"
                        )
                        .value =
                        data.grade || "";

                };

        }

        /* =========================
   時間割
========================= */

const subjects = [
    "国語",
    "数学",
    "英語",
    "理科",
    "社会",
    "体育",
    "音楽",
    "美術",
    "技術・家庭",
    "その他"
];

const weekdays = [
    "月曜日",
    "火曜日",
    "水曜日",
    "木曜日",
    "金曜日"
];

const periods = 6;


/* =========================
   時間割入力欄を作成
========================= */

function createTimetableSettings() {

    const container =
        document.getElementById(
            "timetableSettings"
        );

    container.innerHTML = "";


    weekdays.forEach(function(day, dayIndex) {

        const dayTitle =
            document.createElement("h4");

        dayTitle.textContent = day;

        container.appendChild(dayTitle);


        for (
            let period = 1;
            period <= periods;
            period++
        ) {

            const label =
                document.createElement("label");

            label.textContent =
                period + "時間目";


            const select =
                document.createElement("select");

            select.id =
                "timetable-" +
                dayIndex +
                "-" +
                period;


            /* 未選択 */

            const emptyOption =
                document.createElement("option");

            emptyOption.value = "";

            emptyOption.textContent =
                "選択してください";

            select.appendChild(
                emptyOption
            );


            /* 教科 */

            subjects.forEach(function(subject) {

                const option =
                    document.createElement("option");

                option.value = subject;

                option.textContent = subject;

                select.appendChild(
                    option
                );

            });


            label.appendChild(select);

            container.appendChild(label);

        }

    });

}



/* =========================
   時間割保存
========================= */

document
    .getElementById("saveTimetable")
    .addEventListener(
        "click",
        saveTimetable
    );


function saveTimetable() {

    if (!db) {

        alert(
            "データベースを準備しています。少し待ってください。"
        );

        return;

    }


    const timetable = {};


    weekdays.forEach(function(day, dayIndex) {

        timetable[day] = [];


        for (
            let period = 1;
            period <= periods;
            period++
        ) {

            const select =
                document.getElementById(
                    "timetable-" +
                    dayIndex +
                    "-" +
                    period
                );


            timetable[day].push(
                select.value
            );

        }

    });


    const transaction =
        db.transaction(
            "settings",
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    store.put({

        id: "timetable",

        timetable: timetable

    });


  transaction.oncomplete =
    function() {

        document
            .getElementById(
                "timetableMessage"
            )
            .textContent =
            "✓ 時間割を保存しました";

        loadTimetable();

        /* ホーム画面の時間割も更新 */
        showTodayTimetable();

    };

}



/* =========================
   時間割読み込み
========================= */

function loadTimetable() {

    if (!db) {
        return;
    }


    const transaction =
        db.transaction(
            "settings",
            "readonly"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    const request =
        store.get("timetable");


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (!data) {
                return;
            }


            weekdays.forEach(
                function(day, dayIndex) {

                    const dayData =
                        data.timetable[day];


                    if (!dayData) {
                        return;
                    }


                    dayData.forEach(
                        function(subject, index) {

                            const select =
                                document.getElementById(
                                    "timetable-" +
                                    dayIndex +
                                    "-" +
                                    (index + 1)
                                );


                            if (select) {

                                select.value =
                                    subject;

                            }

                        }
                    );

                }
            );

        };

}



/* =========================
   時間割設定を最初に作る
========================= */

createTimetableSettings();

        /* =========================
   今日の時間割を表示
========================= */

function showTodayTimetable() {

    if (!db) {
        return;
    }

    const today = new Date();

    const dayNames = [
        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"
    ];

    const todayName =
        dayNames[today.getDay()];

    const container =
        document.getElementById(
            "todayTimetable"
        );

    /* 土日 */

    if (
        todayName === "土曜日" ||
        todayName === "日曜日"
    ) {

        container.innerHTML =
            "<p>今日は学校がお休みです。</p>";

        return;

    }


    const transaction =
        db.transaction(
            "settings",
            "readonly"
        );

    const store =
        transaction.objectStore(
            "settings"
        );

    const request =
        store.get("timetable");


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                !data ||
                !data.timetable ||
                !data.timetable[todayName]
            ) {

                container.innerHTML =
                    "<p>今日の時間割が登録されていません。</p>";

                return;

            }


            const timetable =
                data.timetable[todayName];


            container.innerHTML = "";


            timetable.forEach(
                function(subject, index) {

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.style.padding =
                        "10px 0";

                    row.style.borderBottom =
                        "1px solid #eee";


                    const period =
                        document.createElement(
                            "strong"
                        );

                    period.textContent =
                        (index + 1) +
                        "時間目　";


                    const subjectText =
                        document.createElement(
                            "span"
                        );

                    subjectText.textContent =
                        subject ||
                        "未登録";


                    row.appendChild(
                        period
                    );

                    row.appendChild(
                        subjectText
                    );


                    container.appendChild(
                        row
                    );

                }
            );

        };

}
        /* =========================
   教科ごとの持ち物
========================= */

function createBelongingsSettings() {

    const container =
        document.getElementById(
            "belongingsSettings"
        );

    container.innerHTML = "";


    subjects.forEach(function(subject) {

        const label =
            document.createElement("label");

        label.textContent =
            subject + "の持ち物";


        const input =
            document.createElement("input");

        input.type = "text";

        input.id =
            "belongings-" + subject;

        input.placeholder =
            "例：教科書、ノート";


        label.appendChild(input);

        container.appendChild(label);

    });

}



/* =========================
   持ち物を保存
========================= */

document
    .getElementById("saveBelongings")
    .addEventListener(
        "click",
        saveBelongings
    );


function saveBelongings() {

    if (!db) {

        alert(
            "データベースを準備しています。少し待ってください。"
        );

        return;

    }


    const belongings = {};


    subjects.forEach(function(subject) {

        const input =
            document.getElementById(
                "belongings-" + subject
            );


        belongings[subject] =
            input.value;

    });


    const transaction =
        db.transaction(
            "settings",
            "readwrite"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    store.put({

        id: "belongings",

        belongings: belongings

    });


    transaction.oncomplete =
        function() {

            document
                .getElementById(
                    "belongingsMessage"
                )
                .textContent =
                "✓ 持ち物を保存しました";


        };



    transaction.onerror =
        function() {

            alert(
                "持ち物の保存に失敗しました。"
            );

        };

}



/* =========================
   保存した持ち物を読み込む
========================= */

function loadBelongings() {

    if (!db) {
        return;
    }


    const transaction =
        db.transaction(
            "settings",
            "readonly"
        );


    const store =
        transaction.objectStore(
            "settings"
        );


    const request =
        store.get("belongings");


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (!data) {
                return;
            }


            subjects.forEach(
                function(subject) {

                    const input =
                        document.getElementById(
                            "belongings-" +
                            subject
                        );


                    if (input) {

                        input.value =
                            data.belongings[
                                subject
                            ] || "";

                    }

                }
            );

        };

}



/* =========================
   持ち物設定を作成
========================= */

createBelongingsSettings();
    </script>


</body>

</html>
