<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>時間割・予定管理</title>

<style>

/* =========================
   基本
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        Arial,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    background: #f8fafc;

    padding-bottom: 80px;
}


/* =========================
   ヘッダー
========================= */

header {

    background: white;

    padding: 15px 20px;

    border-bottom: 1px solid #ddd;

}

header h1 {

    margin: 0;

    font-size: 20px;

}

#today {

    margin-top: 5px;

    color: #777;

}


/* =========================
   ページ
========================= */

.page {

    display: none;

    padding: 20px;

}

.page.active {

    display: block;

}


/* =========================
   カード
========================= */

.card {

    background: white;

    padding: 20px;

    margin-bottom: 15px;

    border-radius: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.03);

}


/* =========================
   入力
========================= */

label {

    display: block;

    margin-bottom: 15px;

}

input,
select {

    width: 100%;

    padding: 12px;

    margin-top: 7px;

    border:
        1px solid #ccc;

    border-radius: 10px;

    font-size: 16px;

    background: white;

}


/* =========================
   ボタン
========================= */

.save-button {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 10px;

    background: #e85d75;

    color: white;

    font-size: 16px;

    cursor: pointer;

}

.save-button:active {

    transform: scale(0.98);

}


.cancel-button {

    width: 100%;

    padding: 12px;

    margin-top: 10px;

    border: none;

    border-radius: 10px;

    background: #eee;

    cursor: pointer;

    font-size: 16px;

}


/* =========================
   メッセージ
========================= */

.message {

    text-align: center;

    color: #e85d75;

    margin-top: 10px;

}


/* =========================
   下部ナビ
========================= */

.bottom-nav {

    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 70px;

    background: white;

    border-top: 1px solid #ddd;

    display: flex;

    justify-content: space-around;

    align-items: center;

    z-index: 100;

}


.nav-button {

    border: none;

    background: none;

    padding: 8px;

    cursor: pointer;

    color: #777;

    display: flex;

    flex-direction: column;

    align-items: center;

    font-size: 12px;

}


.nav-icon {

    font-size: 22px;

}


.nav-button.active {

    color: #e85d75;

    font-weight: bold;

}


/* =========================
   時間割
========================= */

.timetable-row {

    display: flex;

    align-items: center;

    padding: 12px 0;

    border-bottom:
        1px solid #eee;

}

.period {

    width: 90px;

    font-weight: bold;

}

.subject {

    flex: 1;

}


/* =========================
   持ち物
========================= */

.belonging-item {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 8px 0;

}

.belonging-item input {

    width: 20px;

    height: 20px;

    margin: 0;

}


/* =========================
   月予定カレンダー
========================= */

.calendar-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;

}


.calendar-header h3 {

    margin: 0;

    font-size: 20px;

}


.calendar-header button {

    border: none;

    background: #f1f5f9;

    border-radius: 10px;

    padding: 10px 14px;

    cursor: pointer;

    font-size: 16px;

}


/* カレンダー本体 */

.calendar-grid {

    display: grid;

    grid-template-columns:
        repeat(7, minmax(0, 1fr));

    gap: 5px;

    width: 100%;

}


/* 曜日 */

.calendar-week {

    text-align: center;

    font-weight: bold;

    padding: 5px;

}


/* 日付 */

.calendar-day {

    min-height: 70px;

    border: 1px solid #eee;

    border-radius: 8px;

    background: white;

    padding: 7px;

    cursor: pointer;

    overflow: hidden;

}


.calendar-day:hover {

    background: #fff1f4;

}


.calendar-day.today {

    border:
        2px solid #e85d75;

}


.calendar-day.selected {

    background: #ffe5eb;

}


.calendar-day-number {

    font-size: 14px;

    font-weight: bold;

}


/* カレンダー内予定 */

.calendar-event {

    font-size: 10px;

    margin-top: 4px;

    padding: 2px 4px;

    border-radius: 4px;

    background: #ffe5eb;

    overflow: hidden;

    white-space: nowrap;

}


/* =========================
   予定一覧
========================= */

.event-item {

    padding: 12px 0;

    border-bottom:
        1px solid #eee;

    display: flex;

    justify-content: space-between;

    gap: 10px;

}


.event-delete {

    border: none;

    background: none;

    color: #e85d75;

    cursor: pointer;

    white-space: nowrap;

}


/* =========================
   スマホ
========================= */

@media (max-width: 500px) {

    .page {

        padding: 15px;

    }

    .card {

        padding: 15px;

    }

    .calendar-day {

        min-height: 60px;

    }

    .calendar-event {

        font-size: 9px;

    }

}

</style>

</head>


<body>


<!-- =========================
     ヘッダー
========================= -->

<header>

    <h1>時間割・予定管理</h1>

    <div id="today"></div>

</header>



<!-- =========================
     月予定
========================= -->

<section
    id="monthly"
    class="page">

    <h2>月予定</h2>


    <div class="card">

        <div class="calendar-header">

            <button id="prevMonth">
                ◀
            </button>

            <h3 id="calendarTitle"></h3>

            <button id="nextMonth">
                ▶
            </button>

        </div>


        <!-- ここだけがカレンダー本体 -->

        <div
            id="calendarGrid"
            class="calendar-grid">
        </div>

    </div>


    <!-- 選択した日の予定 -->

    <div class="card">

        <h3 id="selectedDateTitle">
            日付を選択してください
        </h3>

        <div id="eventList">

            <p>
                予定はありません。
            </p>

        </div>


        <button
            id="addEvent"
            class="save-button">

            ＋ 予定を追加

        </button>

    </div>


    <!-- 予定追加フォーム -->

    <div
        id="eventForm"
        class="card"
        style="display:none;">

        <h3>
            予定を追加
        </h3>


        <label>

            予定の種類

            <select id="eventType">

                <option value="部活動">
                    部活動
                </option>

                <option value="学校行事">
                    学校行事
                </option>

                <option value="旅行">
                    旅行
                </option>

                <option value="その他">
                    その他
                </option>

            </select>

        </label>


        <label>

            日付

            <input
                id="eventDate"
                type="date">

        </label>


        <label>

            時間

            <input
                id="eventTime"
                type="time">

        </label>


        <label>

            予定

            <input
                id="eventTitle"
                type="text"
                placeholder="例：部活動">

        </label>


        <button
            id="saveEvent"
            class="save-button">

            保存

        </button>


        <button
            id="cancelEvent"
            class="cancel-button">

            キャンセル

        </button>


        <p
            id="eventMessage"
            class="message">
        </p>

    </div>

</section>



<!-- =========================
     やること
========================= -->

<section
    id="todo"
    class="page">

    <h2>やること</h2>

    <div class="card">

        <h3>
            やることリスト
        </h3>

        <p>
            次の段階で、ここにToDo機能を追加します。
        </p>

    </div>

</section>



<!-- =========================
     ホーム
========================= -->

<section
    id="home"
    class="page active">

    <h2>ホーム</h2>


    <div class="card">

        <h3>
            今日の時間割
        </h3>

        <div id="todayTimetable">

            時間割を読み込んでいます...

        </div>

    </div>

</section>



<!-- =========================
     持ち物
========================= -->

<section
    id="belongings"
    class="page">

    <h2>持ち物</h2>


    <div class="card">

        <h3>
            今日の持ち物
        </h3>

        <div id="todayBelongings">

            持ち物を読み込んでいます...

        </div>

    </div>


    <div class="card">

        <h3>
            特別な持ち物
        </h3>

        <div id="specialBelongings">

            特別な持ち物はありません。

        </div>


        <button
            id="addSpecialBelonging"
            class="save-button">

            ＋ 特別な持ち物を追加

        </button>

    </div>

</section>



<!-- =========================
     設定
========================= -->

<section
    id="settings"
    class="page">

    <h2>設定</h2>


    <!-- 基本情報 -->

    <div class="card">

        <h3>
            基本情報
        </h3>


        <label>

            名前・ニックネーム

            <input
                id="userName"
                type="text"
                placeholder="例：ゆうな">

        </label>


        <label>

            学年

            <select id="userGrade">

                <option value="">
                    選択してください
                </option>

                <option value="中学1年">
                    中学1年
                </option>

                <option value="中学2年">
                    中学2年
                </option>

                <option value="中学3年">
                    中学3年
                </option>

                <option value="高校1年">
                    高校1年
                </option>

                <option value="高校2年">
                    高校2年
                </option>

                <option value="高校3年">
                    高校3年
                </option>

            </select>

        </label>


        <button
            id="saveSettings"
            class="save-button">

            保存

        </button>


        <p
            id="saveMessage"
            class="message">
        </p>

    </div>



    <!-- 時間割設定 -->

    <div class="card">

        <h3>
            時間割設定
        </h3>

        <div id="timetableSettings"></div>


        <button
            id="saveTimetable"
            class="save-button">

            時間割を保存

        </button>


        <p
            id="timetableMessage"
            class="message">
        </p>

    </div>



    <!-- 持ち物設定 -->

    <div class="card">

        <h3>
            教科ごとの持ち物
        </h3>

        <div id="belongingsSettings"></div>


        <button
            id="saveBelongings"
            class="save-button">

            持ち物を保存

        </button>


        <p
            id="belongingsMessage"
            class="message">
        </p>

    </div>

</section>



<!-- =========================
     下部ナビ
========================= -->

<nav class="bottom-nav">


    <button
        class="nav-button"
        onclick="showPage('monthly', this)">

        <span class="nav-icon">
            🗓️
        </span>

        <span>
            月予定
        </span>

    </button>


    <button
        class="nav-button"
        onclick="showPage('todo', this)">

        <span class="nav-icon">
            ✅
        </span>

        <span>
            やること
        </span>

    </button>


    <button
        class="nav-button active"
        onclick="showPage('home', this)">

        <span class="nav-icon">
            🏠
        </span>

        <span>
            ホーム
        </span>

    </button>


    <button
        class="nav-button"
        onclick="showPage('belongings', this)">

        <span class="nav-icon">
            🎒
        </span>

        <span>
            持ち物
        </span>

    </button>


    <button
        class="nav-button"
        onclick="showPage('settings', this)">

        <span class="nav-icon">
            ⚙️
        </span>

        <span>
            設定
        </span>

    </button>

</nav>



<script>

/* =====================================================
   基本
===================================================== */

function showToday() {

    const today = new Date();

    const days = [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
    ];

    document
        .getElementById("today")
        .textContent =
        today.getFullYear() +
        "年" +
        (today.getMonth() + 1) +
        "月" +
        today.getDate() +
        "日（" +
        days[today.getDay()] +
        "）";

}

showToday();



/* =====================================================
   ページ切り替え
===================================================== */

function showPage(pageId, button) {

    document
        .querySelectorAll(".page")
        .forEach(function(page) {

            page.classList.remove("active");

        });


    const page =
        document.getElementById(pageId);

    if (page) {

        page.classList.add("active");

    }


    document
        .querySelectorAll(".nav-button")
        .forEach(function(btn) {

            btn.classList.remove("active");

        });


    if (button) {

        button.classList.add("active");

    }


    /* 月予定を開いたとき */

    if (pageId === "monthly") {

        renderCalendar();

    }


    /* 持ち物を開いたとき */

    if (pageId === "belongings") {

        showTodayBelongings();

        showSpecialBelongings();

    }

}



/* =====================================================
   IndexedDB
===================================================== */

const DB_NAME =
    "ScheduleApp";

const DB_VERSION =
    1;

const STORE_NAME =
    "settings";

let db = null;


const request =
    indexedDB.open(
        DB_NAME,
        DB_VERSION
    );


request.onupgradeneeded =
    function(event) {

        db =
            event.target.result;


        if (
            !db.objectStoreNames.contains(
                STORE_NAME
            )
        ) {

            db.createObjectStore(
                STORE_NAME,
                {
                    keyPath: "id"
                }
            );

        }

    };


request.onsuccess =
    function(event) {

        db =
            event.target.result;


        console.log(
            "IndexedDB接続成功"
        );


        loadSettings();

        loadTimetable();

        loadBelongings();

        showTodayTimetable();

        showTodayBelongings();

        showSpecialBelongings();

        renderCalendar();

    };


request.onerror =
    function(event) {

        console.error(
            "IndexedDBエラー",
            event.target.error
        );

    };



/* =====================================================
   設定
===================================================== */

document
    .getElementById("saveSettings")
    .addEventListener(
        "click",
        saveSettings
    );


function saveSettings() {

    if (!db) {

        alert(
            "データベースを準備しています。"
        );

        return;

    }


    const data = {

        id: "user",

        name:
            document
                .getElementById("userName")
                .value,

        grade:
            document
                .getElementById("userGrade")
                .value

    };


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    transaction
        .objectStore(STORE_NAME)
        .put(data);


    transaction.oncomplete =
        function() {

            document
                .getElementById("saveMessage")
                .textContent =
                "✓ 保存しました";

        };

}


function loadSettings() {

    if (!db) return;


    const request =
        db.transaction(
            STORE_NAME,
            "readonly"
        )
        .objectStore(STORE_NAME)
        .get("user");


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (!data) return;


            document
                .getElementById("userName")
                .value =
                data.name || "";


            document
                .getElementById("userGrade")
                .value =
                data.grade || "";

        };

}



/* =====================================================
   時間割
===================================================== */

const subjects = [

    "国語",
    "数学",
    "英語",
    "理科",
    "社会",
    "体育",
    "音楽",
    "美術",
    "技術・家庭",
    "その他"

];


const weekdays = [

    "月曜日",
    "火曜日",
    "水曜日",
    "木曜日",
    "金曜日"

];


const periods = 6;



/* 時間割入力欄 */

function createTimetableSettings() {

    const container =
        document.getElementById(
            "timetableSettings"
        );


    container.innerHTML = "";


    weekdays.forEach(
        function(day, dayIndex) {

            const title =
                document.createElement("h4");

            title.textContent =
                day;

            container.appendChild(title);


            for (
                let period = 1;
                period <= periods;
                period++
            ) {

                const label =
                    document.createElement(
                        "label"
                    );


                label.textContent =
                    period +
                    "時間目";


                const select =
                    document.createElement(
                        "select"
                    );


                select.id =
                    "timetable-" +
                    dayIndex +
                    "-" +
                    period;


                const empty =
                    document.createElement(
                        "option"
                    );


                empty.value = "";

                empty.textContent =
                    "選択してください";


                select.appendChild(
                    empty
                );


                subjects.forEach(
                    function(subject) {

                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            subject;

                        option.textContent =
                            subject;

                        select.appendChild(
                            option
                        );

                    }
                );


                label.appendChild(select);

                container.appendChild(label);

            }

        }
    );

}


createTimetableSettings();



/* 時間割保存 */

document
    .getElementById("saveTimetable")
    .addEventListener(
        "click",
        saveTimetable
    );


function saveTimetable() {

    if (!db) {

        alert(
            "データベースを準備しています。"
        );

        return;

    }


    const timetable = {};


    weekdays.forEach(
        function(day, dayIndex) {

            timetable[day] = [];


            for (
                let period = 1;
                period <= periods;
                period++
            ) {

                const select =
                    document.getElementById(
                        "timetable-" +
                        dayIndex +
                        "-" +
                        period
                    );


                timetable[day].push(
                    select.value
                );

            }

        }
    );


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    transaction
        .objectStore(STORE_NAME)
        .put({

            id: "timetable",

            timetable:
                timetable

        });


    transaction.oncomplete =
        function() {

            document
                .getElementById(
                    "timetableMessage"
                )
                .textContent =
                "✓ 時間割を保存しました";


            showTodayTimetable();

            showTodayBelongings();

        };

}



/* 時間割読み込み */

function loadTimetable() {

    if (!db) return;


    const request =
        db.transaction(
            STORE_NAME,
            "readonly"
        )
        .objectStore(STORE_NAME)
        .get("timetable");


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                !data ||
                !data.timetable
            ) {

                return;

            }


            weekdays.forEach(
                function(day, dayIndex) {

                    const dayData =
                        data.timetable[day];


                    if (!dayData) return;


                    dayData.forEach(
                        function(subject, index) {

                            const select =
                                document.getElementById(
                                    "timetable-" +
                                    dayIndex +
                                    "-" +
                                    (index + 1)
                                );


                            if (select) {

                                select.value =
                                    subject;

                            }

                        }
                    );

                }
            );

        };

}



/* =====================================================
   今日の時間割
===================================================== */

function showTodayTimetable() {

    if (!db) return;


    const container =
        document.getElementById(
            "todayTimetable"
        );


    const today =
        new Date();


    const dayNames = [

        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"

    ];


    const todayName =
        dayNames[today.getDay()];


    if (
        todayName === "土曜日" ||
        todayName === "日曜日"
    ) {

        container.innerHTML =
            "<p>今日は学校がお休みです。</p>";

        return;

    }


    const request =
        db.transaction(
            STORE_NAME,
            "readonly"
        )
        .objectStore(STORE_NAME)
        .get("timetable");


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                !data ||
                !data.timetable ||
                !data.timetable[todayName]
            ) {

                container.innerHTML =
                    "<p>今日の時間割が登録されていません。</p>";

                return;

            }


            container.innerHTML = "";


            data.timetable[todayName]
                .forEach(
                    function(subject, index) {

                        const row =
                            document.createElement(
                                "div"
                            );


                        row.className =
                            "timetable-row";


                        const period =
                            document.createElement(
                                "div"
                            );


                        period.className =
                            "period";


                        period.textContent =
                            (index + 1) +
                            "時間目";


                        const subjectElement =
                            document.createElement(
                                "div"
                            );


                        subjectElement.className =
                            "subject";


                        subjectElement.textContent =
                            subject ||
                            "未登録";


                        row.appendChild(
                            period
                        );

                        row.appendChild(
                            subjectElement
                        );


                        container.appendChild(
                            row
                        );

                    }
                );

        };

}



/* =====================================================
   教科ごとの持ち物
===================================================== */

function createBelongingsSettings() {

    const container =
        document.getElementById(
            "belongingsSettings"
        );


    container.innerHTML = "";


    subjects.forEach(
        function(subject) {

            const label =
                document.createElement(
                    "label"
                );


            label.textContent =
                subject +
                "の持ち物";


            const input =
                document.createElement(
                    "input"
                );


            input.type =
                "text";


            input.id =
                "belongings-" +
                subject;


            input.placeholder =
                "例：教科書、ノート";


            label.appendChild(input);


            container.appendChild(
                label
            );

        }
    );

}


createBelongingsSettings();



/* 持ち物保存 */

document
    .getElementById("saveBelongings")
    .addEventListener(
        "click",
        saveBelongings
    );


function saveBelongings() {

    if (!db) {

        alert(
            "データベースを準備しています。"
        );

        return;

    }


    const belongings = {};


    subjects.forEach(
        function(subject) {

            belongings[subject] =
                document
                    .getElementById(
                        "belongings-" +
                        subject
                    )
                    .value;

        }
    );


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    transaction
        .objectStore(STORE_NAME)
        .put({

            id: "belongings",

            belongings:
                belongings

        });


    transaction.oncomplete =
        function() {

            document
                .getElementById(
                    "belongingsMessage"
                )
                .textContent =
                "✓ 持ち物を保存しました";


            showTodayBelongings();

        };

}

/* =====================================================
   今日の持ち物
===================================================== */

function showTodayBelongings() {

    if (!db) return;


    const container =
        document.getElementById(
            "todayBelongings"
        );


    const today =
        new Date();


    const dayNames = [

        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"

    ];


    const todayName =
        dayNames[today.getDay()];


    if (
        todayName === "土曜日" ||
        todayName === "日曜日"
    ) {

        container.innerHTML =
            "<p>今日は学校がお休みです。</p>";

        return;

    }


    const transaction =
        db.transaction(
            STORE_NAME,
            "readonly"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    const timetableRequest =
        store.get("timetable");


    const belongingsRequest =
        store.get("belongings");


    timetableRequest.onsuccess =
        function() {

            belongingsRequest.onsuccess =
                function() {

                    const timetableData =
                        timetableRequest.result;


                    const belongingsData =
                        belongingsRequest.result;


                    if (
                        !timetableData ||
                        !timetableData.timetable
                    ) {

                        container.innerHTML =
                            "<p>時間割が登録されていません。</p>";

                        return;

                    }


                    if (
                        !belongingsData ||
                        !belongingsData.belongings
                    ) {

                        container.innerHTML =
                            "<p>教科ごとの持ち物が登録されていません。</p>";

                        return;

                    }


                    const todayTimetable =
                        timetableData
                            .timetable[todayName];


                    if (!todayTimetable) {

                        container.innerHTML =
                            "<p>今日の時間割がありません。</p>";

                        return;

                    }


                    container.innerHTML = "";


                    let hasItems = false;


                    todayTimetable.forEach(
                        function(subject, index) {

                            if (!subject) return;


                            const items =
                                belongingsData
                                    .belongings[
                                        subject
                                    ];


                            if (!items) return;


                            const itemList =
                                items
                                    .split(/[,、]/)
                                    .map(
                                        function(item) {
                                            return item.trim();
                                        }
                                    )
                                    .filter(
                                        function(item) {
                                            return item !== "";
                                        }
                                    );


                            if (
                                itemList.length === 0
                            ) {

                                return;

                            }


                            hasItems = true;


                            const title =
                                document.createElement(
                                    "h4"
                                );


                            title.textContent =
                                (index + 1) +
                                "時間目　" +
                                subject;


                            container.appendChild(
                                title
                            );


                            itemList.forEach(
                                function(item) {

                                    const row =
                                        document.createElement(
                                            "label"
                                        );


                                    row.className =
                                        "belonging-item";


                                    const checkbox =
                                        document.createElement(
                                            "input"
                                        );


                                    checkbox.type =
                                        "checkbox";


                                    const text =
                                        document.createElement(
                                            "span"
                                        );


                                    text.textContent =
                                        item;


                                    row.appendChild(
                                        checkbox
                                    );

                                    row.appendChild(
                                        text
                                    );


                                    container.appendChild(
                                        row
                                    );

                                }
                            );

                        }
                    );


                    if (!hasItems) {

                        container.innerHTML =
                            "<p>今日必要な持ち物は登録されていません。</p>";

                    }

                };

        };

}

function addSpecialBelonging(item) {

    if (!db) return;


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    const request =
        store.get(
            "specialBelongings"
        );


    request.onsuccess =
        function() {

            const data =
                request.result;


            let items = [];


            if (
                data &&
                Array.isArray(data.items)
            ) {

                items =
                    data.items;

            }


            items.push(item);


            store.put({

                id:
                    "specialBelongings",

                items:
                    items

            });


            transaction.oncomplete =
                function() {

                    showSpecialBelongings();

                };

        };

function showSpecialBelongings() {

    if (!db) return;


    const container =
        document.getElementById(
            "specialBelongings"
        );


    const request =
        db.transaction(
            STORE_NAME,
            "readonly"
        )

        function() {

            container.innerHTML = "";

                            "input"
                        );

                        );

function deleteSpecialBelonging(index) {

    if (!db) return;


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    const request =
        store.get(
            "specialBelongings"
        );


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (!data) return;


            data.items.splice(
                index,
                1
            );


            store.put(data);


            transaction.oncomplete =
                function() {

                    showSpecialBelongings();

                };

        };

}



/* =====================================================
   月予定カレンダー
===================================================== */

let calendarDate =
    new Date();

let selectedDate =
    null;



/* カレンダー描画 */

function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendarGrid"
        );


    const title =
        document.getElementById(
            "calendarTitle"
        );


    if (
        !calendar ||
        !title
    ) {

        return;

    }


    const year =
        calendarDate.getFullYear();


    const month =
        calendarDate.getMonth();


    title.textContent =
        year +
        "年" +
        (month + 1) +
        "月";


    calendar.innerHTML = "";


    const weekNames = [

        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"

    ];


    weekNames.forEach(
        function(day) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "calendar-week";


            element.textContent =
                day;


            calendar.appendChild(
                element
            );

        }
    );


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const lastDate =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    /* 月初の空白 */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        calendar.appendChild(
            document.createElement(
                "div"
            )
        );

    }


    /* 日付 */

    for (
        let day = 1;
        day <= lastDate;
        day++
    ) {

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "calendar-day";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "calendar-day-number";


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        const dateString =
            year +
            "-" +
            String(
                month + 1
            ).padStart(2, "0") +
            "-" +
            String(day)
                .padStart(2, "0");


        const today =
            new Date();


        const todayString =
            today.getFullYear() +
            "-" +
            String(
                today.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                today.getDate()
            ).padStart(2, "0");


        if (
            dateString ===
            todayString
        ) {

            cell.classList.add(
                "today"
            );

        }


        if (
            dateString ===
            selectedDate
        ) {

            cell.classList.add(
                "selected"
            );

        }


        cell.addEventListener(
            "click",
            function() {

                selectCalendarDate(
                    dateString
                );

            }
        );


        calendar.appendChild(
            cell
        );


        showCalendarEvents(
            dateString,
            cell
        );

    }

}



/* 日付選択 */

function selectCalendarDate(
    dateString
) {

    selectedDate =
        dateString;


    document
        .getElementById(
            "selectedDateTitle"
        )
        .textContent =
        dateString +
        "の予定";


    document
        .getElementById(
            "eventDate"
        )
        .value =
        dateString;


    renderCalendar();


    showEvents(
        dateString
    );

}



/* カレンダー内の予定 */

function showCalendarEvents(
    dateString,
    cell
) {

    if (!db) return;


    const request =
        db.transaction(
            STORE_NAME,
            "readonly"
        )
        .objectStore(STORE_NAME)
        .get("calendarEvents");


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                !data ||
                !Array.isArray(data.events)
            ) {

                return;

            }


            data.events
                .filter(
                    function(event) {

                        return (
                            event.date ===
                            dateString
                        );

                    }
                )
                .forEach(
                    function(event) {

                        const element =
                            document.createElement(
                                "div"
                            );


                        element.className =
                            "calendar-event";


                        element.textContent =
                            event.title;


                        cell.appendChild(
                            element
                        );

                    }
                );

        };

}



/* 選択日の予定 */

function showEvents(
    dateString
) {

    const list =
        document.getElementById(
            "eventList"
        );


    if (!db) return;


    const request =
        db.transaction(
            STORE_NAME,
            "readonly"
        )
        .objectStore(STORE_NAME)
        .get("calendarEvents");


    request.onsuccess =
        function() {

            const data =
                request.result;


            list.innerHTML = "";


            if (
                !data ||
                !Array.isArray(data.events)
            ) {

                list.innerHTML =
                    "<p>予定はありません。</p>";

                return;

            }


            const events =
                data.events.filter(
                    function(event) {

                        return (
                            event.date ===
                            dateString
                        );

                    }
                );


            if (
                events.length === 0
            ) {

                list.innerHTML =
                    "<p>予定はありません。</p>";

                return;

            }


            events
                .sort(
                    function(a, b) {

                        return a.time
                            .localeCompare(
                                b.time
                            );

                    }
                )
                .forEach(
                    function(event) {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "event-item";


                        const text =
                            document.createElement(
                                "span"
                            );


                        text.textContent =
                            event.time +
                            "　" +
                            event.type +
                            "　" +
                            event.title;


                        const deleteButton =
                            document.createElement(
                                "button"
                            );


                        deleteButton.className =
                            "event-delete";


                        deleteButton.textContent =
                            "削除";


                        deleteButton.onclick =
                            function() {

                                deleteCalendarEvent(
                                    event.id
                                );

                            };


                        item.appendChild(
                            text
                        );


                        item.appendChild(
                            deleteButton
                        );


                        list.appendChild(
                            item
                        );

                    }
                );

        };

}

/* 保存 */

document
    .getElementById("saveEvent")
    .addEventListener(
        "click",
        saveCalendarEvent
    );


function saveCalendarEvent() {

    if (!db) {

        alert(
            "データベースを準備しています。"
        );

        return;

    }


    const date =
        document
            .getElementById(
                "eventDate"
            )
            .value;


    const time =
        document
            .getElementById(
                "eventTime"
            )
            .value;


    const type =
        document
            .getElementById(
                "eventType"
            )
            .value;


    const title =
        document
            .getElementById(
                "eventTitle"
            )
            .value
            .trim();


    if (!date) {

        alert(
            "日付を選択してください。"
        );

        return;

    }


    if (!title) {

        alert(
            "予定を入力してください。"
        );

        return;

    }


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    const request =
        store.get(
            "calendarEvents"
        );


    request.onsuccess =
        function() {

            const data =
                request.result;


            let events = [];


            if (
                data &&
                Array.isArray(data.events)
            ) {

                events =
                    data.events;

            }


            events.push({

                id:
                    Date.now(),

                date:
                    date,

                time:
                    time ||
                    "時間未設定",

                type:
                    type,

                title:
                    title

            });


            store.put({

                id:
                    "calendarEvents",

                events:
                    events

            });


            transaction.oncomplete =
                function() {

                    selectedDate =
                        date;


                    document
                        .getElementById(
                            "eventForm"
                        )
                        .style.display =
                        "none";


                    document
                        .getElementById(
                            "eventTitle"
                        )
                        .value =
                        "";


                    document
                        .getElementById(
                            "eventTime"
                        )
                        .value =
                        "";


                    renderCalendar();


                    showEvents(
                        date
                    );

                };

        };

}



/* =====================================================
   予定削除
===================================================== */

function deleteCalendarEvent(
    eventId
) {

    if (!db) return;


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    const request =
        store.get(
            "calendarEvents"
        );


    request.onsuccess =
        function() {

            const data =
                request.result;


            if (
                !data ||
                !Array.isArray(data.events)
            ) {

                return;

            }


            data.events =
                data.events.filter(
                    function(event) {

                        return (
                            event.id !==
                            eventId
                        );

                    }
                );


            store.put(
                data
            );


            transaction.oncomplete =
                function() {

                    renderCalendar();


                    if (selectedDate) {

                        showEvents(
                            selectedDate
                        );

                    }

                };

        };

}
