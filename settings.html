<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>設定 | 学校生活管理アプリ</title>

  <link
    rel="stylesheet"
    href="css/common.css"
  >

</head>


<body>

  <main class="page">

    <header class="page-header">

      <h1>設定</h1>

      <p class="today"></p>

    </header>


    <!-- ユーザー設定 -->

    <section class="card">

      <h2>プロフィール</h2>


      <label>
        名前・ニックネーム

        <input
          id="nameInput"
          type="text"
          placeholder="名前を入力"
        >

      </label>


      <br><br>


      <label>
        学年

        <select id="gradeInput">

          <option value="">
            選択してください
          </option>

          <option value="中学1年">
            中学1年
          </option>

          <option value="中学2年">
            中学2年
          </option>

          <option value="中学3年">
            中学3年
          </option>

          <option value="高校1年">
            高校1年
          </option>

          <option value="高校2年">
            高校2年
          </option>

          <option value="高校3年">
            高校3年
          </option>

        </select>

      </label>


      <br><br>


      <button id="saveButton">
        保存する
      </button>


      <p id="saveMessage"></p>

    </section>

    <section class="card">

  <h2>教科・科目</h2>

  <p>
    時間割で使用する教科・科目を設定します。
  </p>

  <a
    href="subjects.html"
    class="button-link"
  >
    教科・科目を設定する
  </a>

</section>

    <section class="card">

  <h2>時間割</h2>

  <p>
    曜日ごとの授業を設定します。
  </p>

  <a
    href="timetable.html"
    class="button-link">
    時間割を設定する
  </a>

</section>

    <section class="card">

  <h2>持ち物</h2>

  <p>
    教科ごとの通常の持ち物や、
    毎日持っていくものを設定します。
  </p>

  <a
    href="belongings.html"
    class="button-link">
    持ち物を設定する
  </a>

</section>

  </main>


  <!-- 下部ナビ -->

  <nav class="bottom-nav">

    <div class="nav-inner">

      <a
        class="nav-link"
        href="calendar.html"
      >
        <span class="icon">🗓️</span>
        <span>月予定</span>
      </a>


      <a
        class="nav-link"
        href="todo.html"
      >
        <span class="icon">✅</span>
        <span>やること</span>
      </a>


      <a
        class="nav-link"
        href="index.html"
      >
        <span class="icon">🏠</span>
        <span>ホーム</span>
      </a>


      <a
        class="nav-link"
        href="belongings.html"
      >
        <span class="icon">🎒</span>
        <span>持ち物</span>
      </a>


      <a
        class="nav-link"
        href="settings.html"
      >
        <span class="icon">⚙️</span>
        <span>設定</span>
      </a>

    </div>

  </nav>


  <!-- JavaScript -->

  <script src="js/database.js"></script>

  <script src="js/common.js"></script>

  <script src="js/settings.js"></script>

</body>

</html>
