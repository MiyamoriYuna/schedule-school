
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教科・科目設定 | 学校生活管理アプリ</title>
  <link rel="stylesheet" href="css/common.css?v=2">
</head>

<body>
  <main class="page">

    <header class="page-header">
      <h1>教科・科目設定</h1>
      <p class="today"></p>
    </header>

    <section class="card">
      <h2 id="gradeTitle">教科・科目設定</h2>
      <p>学校で使用している教科・科目を登録してください。</p>
    </section>

    <!-- 検索・絞り込み -->
    <section class="card subject-filter-card">
      <label for="subjectSearch">教科・科目名で検索</label>
      <input
        type="search"
        id="subjectSearch"
        placeholder="例：数学Ⅰ、化学、英語"
        autocomplete="off"
      >

      <label for="categoryFilter">教科分類で絞り込む</label>
      <select id="categoryFilter">
        <option value="all">すべて</option>
      </select>

      <p id="subjectResultCount" aria-live="polite"></p>
    </section>

    <!-- 登録済みの教科 -->
    <section id="subjectContainer" class="subject-container"></section>

    <!-- 教科の追加・編集 -->
    <section class="card" id="subjectForm">
      <h2 id="formTitle">教科・科目を追加</h2>

      <label for="customCategory">教科分類</label>
      <input
        type="text"
        id="customCategory"
        placeholder="例：数学、国語、理科"
        maxlength="40"
      >

      <label for="customSubjectName">
        表示名（時間割に表示する名前）
      </label>
      <input
        type="text"
        id="customSubjectName"
        placeholder="例：英コミ"
        maxlength="60"
      >



      <label for="customAliases">別名（任意）</label>
      <input
        type="text"
        id="customAliases"
        placeholder="例：英語コミュ、英コミュ"
        maxlength="200"
      >

      <p class="form-note">
        別名は「、」または「,」で区切って入力してください。
      </p>

      <button type="button" id="addCustomSubjectButton" class="button">
        登録する
      </button>

      <button
        type="button"
        id="cancelEditButton"
        class="button"
        hidden
      >
        編集をキャンセル
      </button>

      <p
        id="customSubjectMessage"
        class="save-message"
        aria-live="polite"
      ></p>
    </section>

  </main>

  <!-- 下部ナビ -->
  <nav class="bottom-nav">
    <div class="nav-inner">
      <a class="nav-link" href="calendar.html">
        <span class="icon">🗓️</span>
        <span>月予定</span>
      </a>

      <a class="nav-link" href="todo.html">
        <span class="icon">✅</span>
        <span>やること</span>
      </a>

      <a class="nav-link" href="index.html">
        <span class="icon">🏠</span>
        <span>ホーム</span>
      </a>

      <a class="nav-link" href="belongings.html">
        <span class="icon">🎒</span>
        <span>持ち物</span>
      </a>

      <a class="nav-link" href="settings.html">
        <span class="icon">⚙️</span>
        <span>設定</span>
      </a>
    </div>
  </nav>

  <script src="js/database.js"></script>
  <script src="js/common.js"></script>
  <script src="js/subjects.js"></script>
</body>
</html>
